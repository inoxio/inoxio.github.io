<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'de' }}">
  <head>
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <meta name="theme-color" content="#231a3d" />
    <meta property="og:title" content="{{ page.title | default: site.title }}" />
    <meta property="og:description" content="{{ page.description | default: site.description }}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ page.url | absolute_url }}" />
    <meta property="og:image" content="{{ '/assets/img/logo_transparent_100_100.png' | absolute_url }}" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    {%- assign alt = site.pages | where: "ref", page.ref | where_exp: "p", "p.lang != page.lang" | first -%}
    {%- if alt %}
    <link rel="alternate" hreflang="{{ alt.lang }}" href="{{ alt.url | absolute_url }}" />
    <link rel="alternate" hreflang="{{ page.lang }}" href="{{ page.url | absolute_url }}" />
    {%- endif %}
    <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}" />
    <link
      rel="icon"
      type="image/png"
      href="{{ '/assets/favicon_32_gray.png' | relative_url }}"
    />
    <script src="{{ '/assets/application.js' | relative_url }}" defer></script>
  </head>

  <body>
    <main>
      {%- include nav.html -%} {{ content }} {%- include footer.html -%}
    </main>
  </body>
</html>
